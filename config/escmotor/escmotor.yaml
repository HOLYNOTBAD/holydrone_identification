# USB 台架 ESC/电机实验配置，由 scripts/escmotor/escmotor_excite.py 的 --config 加载。
# 普通 Python 配置，不加载到 ROS 参数服务器；会话保存的副本也供离线数据整理使用。
# 电压、指令列表、试转指令和电压容差须填写；等待 Enter 时保持停止，激励结束自动释放输出。
# 数值为当前配置值；检查阈值不是硬件额定限制。稳态未通过仅在线标记，离线整理会排除该片段。

# --- 连接与被测电机 ---
port: auto  # USB 串口；auto 自动选择唯一候选设备，也可填写 /dev/serial/by-id/...
connection_timeout_s: 10.0  # 等待 PX4 心跳或首次 ESC 遥测的时限；s；有限正数
motor_index: 2  # 被激励的 MAVLink 电机功能编号；整数 1–12；物理位置由输出映射决定
esc_index: 0  # 对应 ESC_STATUS 遥测索引；整数 0–11；必须核对实际 ESC 数量和电机映射

# --- 试转与正式实验序列 ---
precheck_command: 0.1  # 试转归一化指令；无量纲，(0, 1]；null 必须填写，不是 PWM 微秒数
precheck_duration_s: 1.0  # 首次试转保持时间；s；有限正数；试转只在整个会话开始时执行一次
voltages_v: [16.8]  # 4S 台架初始电压档；V；按列表顺序人工调压，拟合使用实测带载电压
commands: [0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]  # 从 10% 指令按 5% 步长测至满油门；归一化测试值，不代表转速比例；按列表顺序执行
# 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50
# 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00
voltage_tolerance_v: 0.2  # 正式激励前所选来源的实测电压与目标值的最大绝对偏差；V；有限正数，null 必填
repetitions: 1  # 每个电压/指令组合的重复次数；正整数；每次需 Enter，离线划分至少需两组有效脉冲
pulse_duration_s: 1.0  # 正式脉冲保持时间；s；有限正数；到时自动释放测试输出
pre_record_s: 0.5  # 激励前停止状态的观察时间；s；有限正数；离线也用于截取前置样本
post_record_s: 1.0  # 释放输出后的观察时间；s；有限正数；离线也用于截取降速样本

# --- 反馈与运动检查 ---
voltage_source: battery  # 电压来源：esc 或 battery；BDShot 无 ESC 电压时使用飞控电源测量
battery_id: 0  # BATTERY_STATUS 的电池 ID；本机 PX4 中对应 ULog battery_status.id = 此值 + 1
require_esc_current: false  # 是否强制要求 ESC 电流有效且试转时出现正值；BDShot 仅转速时关闭
telemetry_timeout_s: 0.5  # ESC 接收反馈允许的最大年龄；s；有限正数；离线也作为相邻样本最大间隔
heartbeat_timeout_s: 3.0  # 飞控心跳允许的最大接收年龄；s；有限正数，超时中止
min_samples: 5  # 每次保持期间最少 ESC 遥测样本数；正整数；离线也用于筛选，重复时间戳不计
min_running_rpm: 100.0  # 保持期间绝对转速峰值的最低要求；rpm；有限正数，未达到则中止
stop_rpm: 30.0  # 判定停止的绝对转速上限；rpm；有限正数，使用新收到的遥测判断
stop_timeout_s: 10.0  # 等待转速降至停止门槛的时限；s；有限正数，超时中止

# --- 稳态筛查 ---
steady_window_s: 0.3  # 保持末段的稳态检查窗口；s；有限正数，不得大于试转或正式保持时间
steady_relative_span: 0.05  # 稳态窗口内转速极差/均值上限；无量纲有限正数；0.05 表示 5%，至少需三个样本
