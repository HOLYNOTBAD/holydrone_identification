<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blade · 四组拟合分析</title>
<style>
:root{color-scheme:light;--ink:#213547;--muted:#617386;--line:#dfe7ee}*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:var(--ink);font:15px/1.65 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:36px 22px}h1{font-size:32px;margin:0}h2{font-size:21px;margin:0 0 14px}p{margin:9px 0}.eyebrow{color:#087f8c;letter-spacing:2px;font-size:12px;font-weight:700}.muted{color:var(--muted)}section,.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border-top:4px solid var(--accent);padding:18px}.card h2{font-size:17px}.value{font-size:26px;font-weight:650;white-space:nowrap}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}th{background:#f5f8fa;font-weight:600}img{width:100%;height:auto;display:block}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{font:inherit;cursor:pointer;padding:9px 18px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}button.active{background:var(--ink);color:white}.downloads a{color:#087f8c;margin-right:18px}.note{border-left:4px solid #d47a26;padding:8px 14px;background:#fff8ec}.formula{font-size:20px;font-family:ui-monospace,monospace}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:450px){.cards{grid-template-columns:1fr}main{padding:20px 12px}}
.model{background:#f5f8fa;border-radius:10px;padding:16px 20px;margin:16px 0}.equation,#parameter,#rpmModel{font-family:"Cambria Math",Cambria,serif;font-size:22px;line-height:1.8}.model sub,.model sup{font-size:.7em}
</style></head><body><main>
<section><h2>逐组查看</h2><div class="tabs" id="tabs" role="tablist"></div><p id="detail"></p><div class="model"><div class="equation">F = k<sub>f</sub>ω<sup>2</sup>，ω = 2πn / 60</div><div id="parameter"></div><div id="rpmModel"></div><p class="muted">F 为推力（N），ω 为角速度（rad/s），n 为转速（RPM）。</p></div><img id="plot" alt="所选组拟合曲线与残差"><div class="downloads" id="downloads"></div><h2 style="margin-top:24px">各数据来源在当前模型下的误差</h2><div class="scroll"><table id="sourceErrors"></table></div><h2 style="margin-top:24px">逐点预测与残差</h2><div class="scroll"><table id="points"></table></div></section>

</main><script type="application/json" id="data">__RESULTS_JSON__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
const num=(v,n=4)=>v==null?'—':Number(v).toFixed(n);
const sourceName=id=>id==='manufacturer'?'厂商':id==='summer_measurement'?'暑假':'今日';
function table(id,headers,rows){const el=$(id);el.replaceChildren();const head=document.createElement('tr');headers.forEach(v=>{const cell=document.createElement('th');cell.textContent=v;head.append(cell)});el.append(head);rows.forEach(values=>{const tr=document.createElement('tr');values.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});el.append(tr)})}
data.reports.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.title;b.setAttribute('role','tab');b.addEventListener('click',()=>select(i));$('tabs').append(b)});
function scientific(v){const [m,e]=v.toExponential(7).split('e');return `${m} × 10<sup>${Number(e)}</sup>`}
function select(i){const r=data.reports[i];$('parameter').innerHTML=`k<sub>f</sub> = ${scientific(r.k_f)} N/(rad/s)<sup>2</sup>`;$('rpmModel').innerHTML=`等价转速模型：F = ${scientific(r.k_rpm)} n<sup>2</sup>`;[...$('tabs').children].forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-selected',String(i===j))});$('detail').textContent=`${r.title}：${r.count} 个有效点；实测电压 ${r.voltage_range.map(x=>num(x,3)).join('–')} V。`;$('plot').src=r.key+'/fit.svg';$('downloads').replaceChildren();[['fit.png','PNG 图片'],['fit.pdf','PDF 矢量图'],['fit_points.csv','逐点 CSV'],['report.json','拟合报告 JSON']].forEach(([file,label])=>{const a=document.createElement('a');a.href=r.key+'/'+file;a.textContent=label;$('downloads').append(a)});table('sourceErrors',['数据来源','点数','RMSE [N]','平均残差 [N]'],r.source_metrics.map(s=>[sourceName(s.experiment_id),s.count,num(s.rmse_n),num(s.mean_residual_n)]));table('points',['来源','原表行','RPM','实测推力 [g]','实测 [N]','预测 [N]','残差 [N]'],[...r.points].sort((a,b)=>a.rpm-b.rpm).map(p=>[sourceName(p.experiment_id),p.source_row,num(p.rpm,2),num(p.thrust_g,1),num(p.thrust_n),num(p.predicted_thrust_n),num(p.residual_n)]))}
select(3);
</script></body></html>
